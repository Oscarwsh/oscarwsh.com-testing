        <h4><u>CFOP Intro</u></h4>
        <p>CFOP (Cross, F2L, OLL, PLL) is a popular method for solving the Rubik's Cube. It involves solving the cube in four main steps: the cross, first two layers (F2L), orientation of the last layer (OLL), and permutation of the last layer (PLL).</p>
